name: Release

# Publishes all public @zeroness/* packages (and create-zeroness) to npm.
# Trigger by publishing a GitHub Release, or run manually. Requires an NPM_TOKEN
# repository secret (an npm automation token with publish rights to the scope).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test

      # Publish every non-private package. publishConfig.access=public handles the scope.
      - run: pnpm -r publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
